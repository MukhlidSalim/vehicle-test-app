<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- SAFE FIX: Force light color scheme to prevent dark-mode inversion in reports -->
    <meta name="color-scheme" content="light" />
    <!-- SAFE FIX: Allow proper zoom & accessibility across devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- PWA / Mobile App Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VIS" />
    <link rel="apple-touch-icon" href="/assets/icons/VIS Logo.png" />
    <link rel="icon" type="image/png" href="/assets/icons/VIS Logo.png" />
    
    <title>VI SYSTEM - Vehicle Inspection System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap');

      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* SAFE FIX: prevent dark-mode/auto-invert from turning the report black */
      html { color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #f3f4f6 !important; color: #111827 !important; }
        .a4-preview-wrapper, .report-light { background: #ffffff !important; color: #111827 !important; }
      }

      [lang="ar"], .font-cairo {
        font-family: 'Cairo', sans-serif !important;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        font-variant-ligatures: common-ligatures;
      }

      .a4-preview-wrapper {
        width: 210mm !important;
        min-height: 297mm !important;
        height: fit-content !important;
        background: white !important;
        padding: 10mm 12mm !important; 
        box-sizing: border-box;
        position: relative;
        overflow: visible !important;
        display: flex;
        flex-direction: column;
        margin: 0 !important;
        box-shadow: none;
        border: none;
      }

      .fixed-a4-height {
        height: 297mm !important;
        overflow: hidden !important;
      }

      

      .a4-preview-wrapper > * {
        position: relative;
        z-index: 10;
      }

      .ui-preview-card {
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        border: 1px solid #9ca3af;
        border-radius: 4px;
        overflow: hidden;
        background: white;
      }

      .v-center-cairo {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        line-height: 1.3 !important;
        padding-top: 0 !important;
      }

      .map-container-fixed {
        width: 100%;
        aspect-ratio: 2.8 / 1 !important;
        position: relative !important;
        background: white;
        border: 1px solid #9ca3af;
        border-radius: 12px;
        overflow: hidden;
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body { 
          background: white !important; 
        }
        .no-print { 
          display: none !important; 
        }
        #print-zone {
          display: block !important;
          padding: 0 !important;
          margin: 0 !important;
          width: 210mm !important;
        }
        .a4-preview-wrapper {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .ui-preview-card {
          margin: 0 !important;
          box-shadow: none !important;
          border: none !important;
        }
      }
    </style>
</head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
